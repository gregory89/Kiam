<!DOCTYPE html>
<html lang="es">
  <head>

    <meta http-equiv="refresh" content="0; url=http://localhost:3000/" />
    <title>Lista de Kiam</title>
    <style>
      body {
        margin: 0;
        background: linear-gradient(180deg, #edf6ff 0%, #fdfbf9 100%);
        font-family: Arial, sans-serif;

  <body>
    <div class="box">
